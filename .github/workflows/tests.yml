# GitHub Actions: run test_all.sh on push/PR to master
# Addresses FOSSIL issue #10 ("Run automatic tests on commit", help wanted).
#
# Design notes:
#  - Sequential execution. README warns that benchmarks share temp files,
#    so parallelism would corrupt runs. No matrix / no -j.
#  - CVC4 is installed via apt (simplest reproducible path on Ubuntu runners).
#    Open question for maintainer: is the apt version acceptable, or must we
#    pin to the 2faf908e source build referenced in the README?
#  - minisy is installed from the mini-sygus repo (also by muraliadithya).
#    The benchmark-suite invokes the `minisy` binary; without it every
#    benchmark fails with "minisy: not found".
#  - The .sy grammar suite (test_grammars.sh, covers the lvl1 grammars) is in
#    a separate job triggered only manually, because SyGuS synthesis can be
#    slow / non-terminating and should not block every push.

name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:   # allows manual "Run workflow" from the Actions tab

jobs:
  benchmark-suite:
    name: benchmark-suite (test_all.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 60 min lets the full 50-benchmark suite complete. Most benchmarks finish
    # in <25s; a handful (bst-left-right, bst-leftmost, cyclic-next,
    # list-even-or-odd, ...) legitimately hit the 360s per-file timeout. The
    # job timeout therefore needs to comfortably exceed
    # (num_timeouts * 360s) + (fast benchmarks).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make test scripts executable
        # Sets the executable bit on the Ubuntu runner regardless of whether it
        # was committed correctly from a Windows contributor's machine.
        run: chmod +x test_all.sh test_grammars.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install CVC4
        # NOTE: apt provides CVC4 but the version may differ from the 1.9 / commit
        # 2faf908e pinned in the README. If reproducibility requires the exact
        # pinned build, replace this step with a source build at 2faf908e.
        run: |
          sudo apt-get update
          sudo apt-get install -y cvc4
          cvc4 --version || cvc4 -version || true

      - name: Install minisy (mini-sygus, breadth_first branch)
        # The benchmark-suite invokes the `minisy` binary from the mini-sygus
        # repo (github.com/muraliadithya/mini-sygus). We clone the
        # `breadth_first` branch rather than `master` because FOSSIL's
        # benchmarks use non-finite grammars:
        #  - `master`'s ConstraintGrammar raises
        #    `ValueError: Grammar is not finite. Unsupported.` (see
        #    mini-sygus/solver/ConstraintGrammar.py:50-51).
        #  - `streaming` gets past that but crashes with
        #    `ValueError: max() arg is an empty sequence` on rules with no
        #    symbols (SyGuSGrammar.py:271).
        #  - `breadth_first` is the branch where infinite-grammar support was
        #    being developed (mini-sygus issue #15 is literally titled
        #    "Add support for infinite grammar in breadth_first branch") and
        #    its SyGuSGrammar explicitly handles empty rules ("A rule without
        #    any nonterminals is of height 0").
        run: |
          git clone --depth 1 --branch breadth_first https://github.com/muraliadithya/mini-sygus.git /tmp/mini-sygus
          pip install -r /tmp/mini-sygus/requirements.txt || true
          chmod +x /tmp/mini-sygus/scripts/minisy
          # Put minisy on PATH and mini-sygus package on PYTHONPATH.
          echo "/tmp/mini-sygus/scripts" >> $GITHUB_PATH

      - name: Set PYTHONPATH (FOSSIL root + mini-sygus)
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE:/tmp/mini-sygus" >> $GITHUB_ENV

      - name: Run test_all.sh
        # continue-on-error: the suite is a research synthesis benchmark, where
        # a handful of legitimately hard instances legitimately time out (360s
        # per-file). The step's job is to RUN the suite and REPORT the baseline,
        # not to gate on 100% pass. A regression is visible as a drop in the
        # pass count (e.g. 42 -> 30). See the PR description for the baseline.
        continue-on-error: true
        run: ./test_all.sh

  grammar-suite:
    name: grammar-suite (test_grammars.sh, covers lvl1)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Run only on manual dispatch to avoid slow SyGuS runs on every push.
    # A maintainer can move this to `on: push` once timings are confirmed.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make test scripts executable
        run: chmod +x test_all.sh test_grammars.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install CVC4
        run: |
          sudo apt-get update
          sudo apt-get install -y cvc4
          cvc4 --version || cvc4 -version || true

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run test_grammars.sh
        run: ./test_grammars.sh
